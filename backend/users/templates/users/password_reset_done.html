
{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 40px auto;">
    <h1>Check Your Email</h1>

    <p>
        If an account exists with the email address you entered,

    <p>
        <a href="{% url 'users:login' %}">Return to login</a>
    </p>
</div>
{% endblock %}
