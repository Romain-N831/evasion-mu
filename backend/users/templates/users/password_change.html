
{% extends "base.html" %}

{% block title %}Change Password | Evasion.mu{% endblock %}

{% block content %}
<section class="container" style="max-width: 560px; margin: 40px auto; padding: 0 20px;">
    <h1>Change password</h1>

    {% if messages %}
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update password</button>
    </form>

    <p>
        <a href="{% url 'users:profile' %}">
            Back to my profile
        </a>
    </p>
</section>
{% endblock %}
