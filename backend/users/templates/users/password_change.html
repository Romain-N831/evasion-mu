
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Change Password</h1>

    <p>
        Enter your current password and choose a new password
        for your Evasion.mu account.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Update Password</button>
    </form>

    <p>
        <a href="{% url 'users:profile' %}">
            Back to My Profile
        </a>
    </p>
</div>
{% endblock %}
