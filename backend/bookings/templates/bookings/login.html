{% extends "base.html" %}
{% load static %}

{% block title %}Log in | Evasion.mu{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'bookings/css/bookings.css' %}">
{% endblock %}

{% block content %}
<section class="bookings-page bookings-login-page">
    <div class="bookings-card bookings-login-card">
        <span class="bookings-eyebrow">WELCOME BACK</span>
        <h1>Log in</h1>
        <p class="bookings-muted">Log in to view your bookings and reservations.</p>

        <!-- Django's existing LoginView handles authentication. -->
        <form method="post" action="{% url 'bookings:login' %}" class="bookings-form bookings-login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="bookings-button bookings-button-primary">Log in</button>
        </form>

        <a class="bookings-back-link bookings-bottom-link" href="{% url 'bookings:index' %}">
            &larr; Back to bookings
        </a>
    </div>
</section>
{% endblock %}
